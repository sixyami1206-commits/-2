<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バトルプロ (Battle Pro)</title>
    <style>
        :root { --p:#ffc107; --s:#00bcd4; --d:#ff5722; --g:#4caf50; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; color: #fff; }
        
        /* 16:9 レスポンシブコンテナ */
        #game-container { position: relative; width: 100%; height: 100%; max-width: 1024px; max-height: 576px; margin: auto; top: 50%; transform: translateY(-50%); aspect-ratio: 16/9; background: #1a1a2e; overflow: hidden; box-shadow: 0 0 20px #000; }
        .screen { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: none; flex-direction: column; }
        .screen.active { display: flex; }
        
        /* ブロスタ風ポップボタン */
        .btn { padding: 8px 16px; font-size: 14px; font-weight: bold; color: #fff; background: var(--p); border: 2px solid #000; border-radius: 8px; box-shadow: 0 4px 0 #000; cursor: pointer; text-shadow: 1px 1px 0 #000; text-align: center; }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
        .btn-s { background: var(--s); } .btn-d { background: var(--d); } .btn-g { background: var(--g); }

        /* ローディング・タイトル */
        #scr-load { background: #0f172a; justify-content: center; align-items: center; z-index: 100; }
        #scr-title { justify-content: center; align-items: center; background: radial-gradient(#1f4068, #111); }

        /* ホーム画面 */
        #scr-home { display: none; grid-template-rows: 40px 1fr 60px; }
        #scr-home.active { display: grid; }
        .top-bar { background: rgba(0,0,0,0.6); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 2px solid #000; }
        .home-main { display: grid; grid-template-columns: 140px 1fr 140px; padding: 10px; gap: 10px; align-items: center; }
        .side-menu { display: flex; flex-direction: column; gap: 8px; }
        .stage { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
        .avatar { width: 90px; height: 110px; border-radius: 12px; border: 3px solid #000; box-shadow: 0 4px 0 #000; display: flex; justify-content: center; align-items: center; font-size: 36px; }
        .bot-bar { background: rgba(0,0,0,0.6); border-top: 2px solid #000; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }

        /* サブウインドウ共通 */
        .sub-scr { background: rgba(20,20,35,0.95); padding: 12px; overflow-y: auto; z-index: 20; }
        .sub-hd { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
        
        /* アイテムカード */
        .card { background: #2a2a40; border: 2px solid #000; border-radius: 8px; padding: 6px; text-align: center; cursor: pointer; box-shadow: 0 3px 0 #000; position: relative; }
        .card.locked { filter: grayscale(0.8) opacity(0.5); }
        .card.selected { border-color: var(--p); background: #3b3b5c; }
        .card-icon { width: 40px; height: 40px; margin: 0 auto 4px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 20px; border: 2px solid #000; }

        /* バトル画面＆パッド */
        #scr-battle { background: #2b3a42; position: relative; }
        #canvas { width: 100%; height: 100%; display: block; }
        .btl-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
        .btl-bot { display: flex; justify-content: space-between; align-items: flex-end; pointer-events: auto; }
        .pad-zone { width: 90px; height: 90px; background: rgba(255,255,255,0.1); border: 2px dashed #fff; border-radius: 50%; position: relative; }
        .pad-hand { width: 36px; height: 36px; background: #fff; border: 2px solid #000; border-radius: 50%; position: absolute; top: 27px; left: 27px; }
        .act-zone { display: flex; gap: 8px; }
        .btn-c { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #000; color: #fff; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 12px; text-shadow: 1px 1px 0 #000; }

        #toast-layer { position: absolute; top: 50px; right: 15px; z-index: 200; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
        .toast { background: var(--g); border: 2px solid #000; padding: 6px 12px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="toast-layer"></div>

    <div id="scr-load" class="screen active">
        <div style="font-size:28px; color:var(--p); margin-bottom:10px; font-weight:bold;">BATTLE PRO</div>
        <div style="width:50%; height:12px; background:#334155; border:2px solid #000; border-radius:6px; overflow:hidden;"><div id="progress" style="width:0%; height:100%; background:var(--g); transition:width 0.1s;"></div></div>
    </div>

    <div id="scr-title" class="screen">
        <div style="font-size:48px; font-weight:bold; font-style:italic; margin-bottom:20px; text-shadow:3px 3px 0 #000;">BATTLE PRO</div>
        <button class="btn" onclick="Game.enterHome()">TAP TO START</button>
    </div>

    <div id="scr-home" class="screen">
        <div class="top-bar">
            <div><span id="p-name">Player</span> <span id="p-rank" style="color:var(--p)">Lv.1</span></div>
            <div>
                <span class="btn" style="padding:2px 8px; font-size:11px; background:#222;">🪙 <span id="val-coin">0</span></span>
                <span class="btn" style="padding:2px 8px; font-size:11px; background:#222; margin-left:5px;">💎 <span id="val-emr">0</span></span>
            </div>
        </div>
        <div class="home-main">
            <div class="side-menu">
                <button class="btn btn-s" onclick="UI.showSub('sub-chars')">キャラ</button>
                <button class="btn btn-s" onclick="UI.showSub('sub-shop')">ショップ</button>
            </div>
            <div class="stage">
                <div id="h-char-name" style="font-size:16px; margin-bottom:8px; font-weight:bold;"></div>
                <div class="avatar" id="h-char-av"></div>
            </div>
            <div class="side-menu">
                <button class="btn btn-s" onclick="UI.showSub('sub-mis')">ミッション</button>
                <button class="btn btn-s" onclick="UI.showSub('sub-set')">設定</button>
            </div>
        </div>
        <div class="bot-bar">
            <button class="btn btn-s" id="btn-mode" onclick="UI.showSub('sub-modes')">モード</button>
            <button class="btn btn-d" style="font-size:18px; padding:6px 40px;" onclick="Game.startMatch()">BATTLE</button>
        </div>
    </div>

    <div id="sub-chars" class="screen sub-scr">
        <div class="sub-hd"><h3>ヒーロー選択 (<span id="unl-count">0</span>/50)</h3><button class="btn btn-d" onclick="UI.closeSub()">閉じる</button></div>
        <div id="char-box" style="background:rgba(0,0,0,0.4); padding:8px; border-radius:6px; margin-bottom:8px; display:none; font-size:12px;"></div>
        <div class="grid" id="grid-chars"></div>
    </div>

    <div id="sub-shop" class="screen sub-scr">
        <div class="sub-hd"><h3>ショップ</h3><button class="btn btn-d" onclick="UI.closeSub()">閉じる</button></div>
        <div style="font-size:12px; color:var(--p); margin-bottom:4px;">必殺技強化 (各2,000金)</div>
        <div class="grid" id="grid-shop-ult" style="margin-bottom:10px;"></div>
        <div style="font-size:12px; color:var(--s); margin-bottom:4px;">限定スキン (各50宝石)</div>
        <div class="grid" id="grid-shop-skin"></div>
    </div>

    <div id="sub-mis" class="screen sub-scr">
        <div class="sub-hd"><h3>ミッション</h3><button class="btn btn-d" onclick="UI.closeSub()">閉じる</button></div>
        <div style="font-size:12px; background:#222; padding:8px; border-radius:6px;">⚔️ <strong>アリーナの覇者</strong><br>敵を撃破せよ。報酬: 🪙500 / 💎20</div>
    </div>
    <div id="sub-set" class="screen sub-scr">
        <div class="sub-hd"><h3>設定</h3><button class="btn btn-d" onclick="UI.closeSub()">閉じる</button></div>
        <label style="font-size:13px;"><input type="checkbox" id="chk-snd" checked> 効果音システム(WebAudioAPI)</label>
        <button class="btn btn-d" style="margin-top:15px; display:block; width:100%;" onclick="Storage.reset()">セーブデータ初期化</button>
    </div>
    <div id="sub-modes" class="screen sub-scr">
        <div class="sub-hd"><h3>作戦モード</h3><button class="btn btn-d" onclick="UI.closeSub()">閉じる</button></div>
        <div class="grid" id="grid-modes"></div>
    </div>

    <div id="scr-battle" class="screen">
        <canvas id="canvas"></canvas>
        <div class="btl-ui">
            <div style="display:flex; justify-content:space-between; width:100%; font-size:14px; background:rgba(0,0,0,0.5); padding:4px 10px; border-radius:4px;">
                <span id="b-score" style="color:var(--s)">0 VS 0</span>
                <span id="b-time" style="color:var(--p)">01:00</span>
                <span id="b-obj" style="font-size:11px;">作戦遂行中</span>
            </div>
            <div class="btl-bot">
                <div class="pad-zone" id="v-joy"><div class="pad-hand" id="v-hand"></div></div>
                <div class="act-zone">
                    <div class="btn-c" id="b-atk" style="background:var(--d);">通常</div>
                    <div class="btn-c" id="b-ult" style="background:var(--p);">必殺</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 音源生成
const Sound = {
    ctx: null, enabled: true,
    init() { try { this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } catch(e){} },
    play(f, d, t='sine') {
        if (!this.enabled || !this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        let o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, this.ctx.currentTime);
        g.gain.setValueAtTime(0.1, this.ctx.currentTime);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + d);
    }
};

// 50体オリジナルキャラクターデータ（超圧縮生成）
const CharacterDB = [];
const types = ["突撃", "防衛", "隠密", "狙撃", "支援"];
const colors = ["#ff5722", "#00bcd4", "#4caf50", "#ffc107", "#9c27b0", "#e91e63", "#3f51b5", "#009688", "#ff9800", "#795548"];
const emojis = ["🔥","💧","⚡","🌿","🌟","💎","🎯","🛡️","🚀","💥","🐺","🦊","🐯","🦁","🐵","🦅","🦉","🐝","👾","🤖"];
for(let i=1; i<=50; i++) {
    CharacterDB.push({
        id: i, name: `ヒーロー #${i}`, type: types[i%5], hp: 2500+(i*50), atk: 200+(i*8), spd: 3.5+(i%3)*0.4,
        color: colors[i%10], emoji: emojis[i%20], cost: i<=5 ? 0 : 800+(i*40)
    });
}

const GameModes = [
    { id: 'm_3v3', name: '3対3 チーム戦', target: 8 },
    { id: 'm_area', name: 'エリア制圧戦', target: 50 },
    { id: 'm_surv', name: 'サバイバル', target: 3 },
    { id: 'm_bot', name: 'BOT訓練戦', target: 5 }
];

// セーブデータ管理
const Storage = {
    data: { coins: 4000, emeralds: 100, rank: 1, unlockedChars: [1,2,3,4,5], selectedChar: 1, unlockedUlts: [], unlockedSkins: [], selectedMode: 'm_3v3' },
    load() {
        let local = localStorage.getItem('b_pro_save');
        if (local) { try { this.data = Object.assign(this.data, JSON.parse(local)); } catch(e){} }
        this.save();
    },
    save() { localStorage.setItem('b_pro_save', JSON.stringify(this.data)); this.sync(); },
    reset() { localStorage.removeItem('b_pro_save'); location.reload(); },
    sync() {
        document.getElementById('val-coin').innerText = this.data.coins;
        document.getElementById('val-emr').innerText = this.data.emeralds;
        document.getElementById('p-rank').innerText = `Lv.${this.data.rank}`;
        document.getElementById('unl-count').innerText = this.data.unlockedChars.length;
        let c = CharacterDB.find(x => x.id === this.data.selectedChar);
        if (c) {
            document.getElementById('h-char-name').innerText = `${c.name} (${c.type})`;
            let av = document.getElementById('h-char-av'); av.style.backgroundColor = c.color; av.innerText = c.emoji;
        }
        let m = GameModes.find(x => x.id === this.data.selectedMode);
        if (m) document.getElementById('btn-mode').innerText = m.name;
    }
};

// UI駆動インターフェース
const UI = {
    toast(m) {
        let container = document.getElementById('toast-layer'), t = document.createElement('div');
        t.className = 'toast'; t.innerText = m; container.appendChild(t); setTimeout(() => t.remove(), 1800);
    },
    screen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); },
    showSub(id) {
        document.getElementById(id).classList.add('active');
        if (id === 'sub-chars') this.drawChars();
        if (id === 'sub-shop') this.drawShop();
        if (id === 'sub-modes') this.drawModes();
    },
    closeSub() { document.querySelectorAll('.sub-scr').forEach(s => s.classList.remove('active')); Storage.sync(); },
    drawChars() {
        let g = document.getElementById('grid-chars'); g.innerHTML = '';
        CharacterDB.forEach(c => {
            let unl = Storage.data.unlockedChars.includes(c.id), sel = Storage.data.selectedChar === c.id;
            let card = document.createElement('div'); card.className = `card ${!unl?'locked':''} ${sel?'selected':''}`;
            card.innerHTML = `<div class="card-icon" style="background:${c.color}">${c.emoji}</div><div style="font-size:10px;font-weight:bold;">${c.name}</div>`;
            card.onclick = () => {
                Sound.play(500, 0.05);
                let box = document.getElementById('char-box'); box.style.display = 'block';
                if(unl) {
                    Storage.data.selectedChar = c.id; Storage.save(); UI.drawChars();
                    box.innerHTML = `<strong>選択中: ${c.name}</strong> (HP:${c.hp} / ATK:${c.atk})`;
                } else {
                    box.innerHTML = `${c.name} (未解放)<br><button class="btn btn-g" style="padding:2px 6px; font-size:11px; margin-top:4px;" onclick="UI.unlockChar(${c.id})">🪙${c.cost} 解放</button>`;
                }
            };
            g.appendChild(card);
        });
    },
    unlockChar(id) {
        let c = CharacterDB.find(x => x.id === id);
        if(Storage.data.coins >= c.cost) {
            Storage.data.coins -= c.cost; Storage.data.unlockedChars.push(id); Storage.data.selectedChar = id;
            Storage.save(); Sound.play(800, 0.2, 'triangle'); this.toast(`${c.name} 解放！`); this.drawChars();
        } else this.toast('コイン不足！');
    },
    drawShop() {
        let ug = document.getElementById('grid-shop-ult'), sg = document.getElementById('grid-shop-skin');
        ug.innerHTML = ''; sg.innerHTML = '';
        CharacterDB.slice(0, 6).forEach(c => {
            let buy = Storage.data.unlockedUlts.includes(c.id);
            ug.innerHTML += `<div class="card"><div>⚡ #${c.id}</div><button class="btn ${buy?'btn-s':'btn-g'}" style="font-size:10px;padding:2px;" onclick="UI.buyShop('ult',${c.id},2000)" ${buy?'disabled':''}>${buy?'完了':'🪙2k'}</button></div>`;
            let sk = Storage.data.unlockedSkins.includes(c.id);
            sg.innerHTML += `<div class="card"><div>🎨 #${c.id}</div><button class="btn ${sk?'btn-s':'btn-g'}" style="font-size:10px;padding:2px;" onclick="UI.buyShop('skin',${c.id},50)" ${sk?'disabled':''}>${sk?'所有':'💎50'}</button></div>`;
        });
    },
    buyShop(type, id, cost) {
        if(type==='ult' && Storage.data.coins >= cost) { Storage.data.coins -= cost; Storage.data.unlockedUlts.push(id); this.toast('必殺技永久解放！'); }
        else if(type==='skin' && Storage.data.emeralds >= cost) { Storage.data.emeralds -= cost; Storage.data.unlockedSkins.push(id); this.toast('限定スキン購入！'); }
        else { this.toast('通貨不足！'); return; }
        Storage.save(); this.drawShop();
    },
    drawModes() {
        let g = document.getElementById('grid-modes'); g.innerHTML = '';
        GameModes.forEach(m => {
            let sel = Storage.data.selectedMode === m.id, card = document.createElement('div');
            card.className = `card ${sel?'selected':''}`; card.innerHTML = `<div style="font-size:11px;font-weight:bold;">${m.name}</div>`;
            card.onclick = () => { Storage.data.selectedMode = m.id; Storage.save(); UI.drawModes(); };
            g.appendChild(card);
        });
    }
};

// ==========================================================================
// 前編ここまで。この直下に【中編：バトルエンジン】のスクリプトブロックが接続します。
// ==========================================================================
// ==========================================================================
// 4. バトルオブジェクト・物理衝突・入力制御エンジン（中編）
// ==========================================================================
const BattleEngine = {
    canvas: null, ctx: null, active: false,
    entities: [], bullets: [], particles: [],
    player: null, joy: { active: false, startX: 0, startY: 0, moveX: 0, moveY: 0, dirX: 0, dirY: 0 },
    keys: {}, map: { w: 900, h: 900 }, modeInfo: null, timer: 60, lastTime: 0,

    init() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupControls();
    },

    resize() {
        if (!this.canvas) return;
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;
    },

    setupControls() {
        // キーボード操作対応
        window.onkeydown = (e) => { this.keys[e.key.toLowerCase()] = true; };
        window.onkeyup = (e) => { this.keys[e.key.toLowerCase()] = false; };

        // バーチャルジョイスティック制御
        const zone = document.getElementById('v-joy'), hand = document.getElementById('v-hand');
        
        const padStart = (x, y) => {
            this.joy.active = true;
            const r = zone.getBoundingClientRect();
            this.joy.startX = r.left + r.width / 2;
            this.joy.startY = r.top + r.height / 2;
        };

        const padMove = (x, y) => {
            if (!this.joy.active) return;
            let dx = x - this.joy.startX, dy = y - this.joy.startY;
            let dist = Math.hypot(dx, dy), max = 30;
            if (dist > max) { dx *= max / dist; dy *= max / dist; }
            hand.style.transform = `translate(${dx}px, ${dy}px)`;
            this.joy.dirX = dx / max; this.joy.dirY = dy / max;
        };

        const padEnd = () => {
            this.joy.active = false;
            this.joy.dirX = 0; this.joy.dirY = 0;
            hand.style.transform = 'translate(0px, 0px)';
        };

        zone.ontouchstart = (e) => padStart(e.touches[0].clientX, e.touches[0].clientY);
        window.ontouchmove = (e) => { if (this.joy.active) padMove(e.touches[0].clientX, e.touches[0].clientY); };
        window.ontouchend = () => padEnd();

        zone.onmousedown = (e) => padStart(e.clientX, e.clientY);
        window.onmousemove = (e) => { if (this.joy.active) padMove(e.clientX, e.clientY); };
        window.onmouseup = () => padEnd();

        // 攻撃ボタンイベント
        document.getElementById('b-atk').onclick = () => this.playerAction('attack');
        document.getElementById('b-ult').onclick = () => this.playerAction('ult');
    },

    start(charId, modeId) {
        this.active = true;
        this.entities = []; this.bullets = []; this.particles = [];
        this.modeInfo = GameModes.find(m => m.id === modeId) || GameModes[0];
        this.timer = this.modeInfo.id === 'm_area' ? 90 : 60;
        this.lastTime = performance.now();

        const baseChar = CharacterDB.find(c => c.id === charId) || CharacterDB[0];
        
        // プレイヤー生成（チーム1: ブルー）
        this.player = {
            id: 'player', name: 'あなた', team: 1, x: 150, y: 450, r: 18,
            hp: baseChar.hp, maxHp: baseChar.hp, atk: baseChar.atk, spd: baseChar.spd,
            emoji: baseChar.emoji, color: '#3498db', ultCharge: 0, maxUlt: 100,
            targetX: 150, targetY: 450, lastShot: 0
        };
        this.entities.push(this.player);

        // 味方BOT 2体追加
        for (let i = 1; i <= 2; i++) {
            let bc = CharacterDB[(charId + i) % 50];
            this.entities.push({
                id: `ally_${i}`, name: `味方味 #${i}`, team: 1, x: 150, y: 250 + (i * 200), r: 18,
                hp: bc.hp, maxHp: bc.hp, atk: bc.atk, spd: bc.spd, emoji: bc.emoji, color: '#2ecc71',
                aiState: 'search', targetX: 0, targetY: 0, lastShot: 0
            });
        }

        // 敵チームBOT 3体追加（チーム2: レッド）
        for (let i = 1; i <= 3; i++) {
            let bc = CharacterDB[(charId + i + 5) % 50];
            this.entities.push({
                id: `enemy_${i}`, name: `敵兵 #${i}`, team: 2, x: 750, y: 150 + (i * 200), r: 18,
                hp: bc.hp, maxHp: bc.hp, atk: bc.atk, spd: bc.spd, emoji: bc.emoji, color: '#e74c3c',
                aiState: 'search', targetX: 0, targetY: 0, lastShot: 0
            });
        }

        // スコア表示初期化
        this.blueScore = 0; this.redScore = 0;
        this.updateUI();
        
        UI.screen('scr-battle');
        requestAnimationFrame((t) => this.loop(t));
    },

    playerAction(type) {
        if (!this.active || this.player.hp <= 0) return;
        const now = performance.now();
        if (now - this.player.lastShot < 350) return; // 連射制限

        // 最寄りの敵を自動ロックオンしてエイム方向を計算
        let target = null, minDist = 400;
        this.entities.forEach(e => {
            if (e.team !== this.player.team && e.hp > 0) {
                let d = Math.hypot(e.x - this.player.x, e.y - this.player.y);
                if (d < minDist) { minDist = d; target = e; }
            }
        });

        let angle = 0;
        if (target) {
            angle = Math.atan2(target.y - this.player.y, target.x - this.player.x);
        } else {
            angle = Math.atan2(this.joy.dirY, this.joy.dirX) || 0;
        }

        if (type === 'attack') {
            Sound.play(440, 0.1);
            this.spawnBullet(this.player, angle, false);
            this.player.lastShot = now;
        } else if (type === 'ult' && this.player.ultCharge >= this.player.maxUlt) {
            Sound.play(660, 0.25, 'sawtooth');
            this.spawnBullet(this.player, angle, true);
            this.player.ultCharge = 0;
            this.player.lastShot = now;
            document.getElementById('b-ult').style.boxShadow = '0 4px 0 #000';
        }
    },

    spawnBullet(owner, angle, isUlt) {
        const speed = isUlt ? 9 : 12;
        const size = isUlt ? 16 : 6;
        const dmg = isUlt ? owner.atk * 2.5 : owner.atk;
        this.bullets.push({
            ownerId: owner.id, team: owner.team,
            x: owner.x, y: owner.y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            r: size, dmg: dmg, isUlt: isUlt, range: isUlt ? 450 : 350, travelled: 0
        });
    },

    spawnParticle(x, y, color, count=5) {
        for(let i=0; i<count; i++) {
            let a = Math.random() * Math.PI * 2, spd = Math.random() * 3 + 1;
            this.particles.push({
                x: x, y: y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
                r: Math.random() * 3 + 2, color: color, life: 1.0, decay: Math.random() * 0.04 + 0.03
            });
        }
    },

    updateUI() {
        document.getElementById('b-score').innerText = `${this.blueScore} VS ${this.redScore}`;
        let m = Math.floor(this.timer / 60), s = Math.floor(this.timer % 60);
        document.getElementById('b-time').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        
        let charge = Math.min(100, Math.floor((this.player.ultCharge / this.player.maxUlt) * 100));
        let uBtn = document.getElementById('b-ult');
        uBtn.innerText = charge >= 100 ? '奥義可' : `${charge}%`;
        uBtn.style.background = charge >= 100 ? '#f1c40f' : '#7f8c8d';
        if(charge >= 100) uBtn.style.boxShadow = '0 0 12px #f1c40f';
    },

    drawMap() {
        // 2.5D風フィールドのグリッド背景描画
        this.ctx.fillStyle = '#1c2833';
        this.ctx.fillRect(0, 0, this.map.w, this.map.h);
        
        this.ctx.strokeStyle = '#2c3e50';
        this.ctx.lineWidth = 1;
        for (let x = 0; x < this.map.w; x += 50) {
            this.ctx.beginPath(); this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.map.h); this.ctx.stroke();
        }
        for (let y = 0; y < this.map.h; y += 50) {
            this.ctx.beginPath(); this.ctx.moveTo(0, y); this.ctx.lineTo(this.map.w, y); this.ctx.stroke();
        }

        // 外周境界線の描画
        this.ctx.strokeStyle = '#e74c3c'; this.ctx.lineWidth = 4;
        this.ctx.strokeRect(0, 0, this.map.w, this.map.h);

        // 中央エリア制圧戦用のアクティブゾーン
        if (this.modeInfo.id === 'm_area') {
            this.ctx.fillStyle = 'rgba(52, 152, 219, 0.15)';
            this.ctx.strokeStyle = '#3498db'; this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            this.ctx.arc(this.map.w/2, this.map.h/2, 100, 0, Math.PI*2);
            this.ctx.fill(); this.ctx.stroke();
            
            this.ctx.font = '12px sans-serif'; this.ctx.fillStyle = '#3498db';
            this.ctx.fillText("制圧エリア", this.map.w/2 - 30, this.map.h/2 + 5);
        }
    }
};

// ==========================================================================
// 中編ここまで。この直後に【後編：AIボット・ゲームルール・統合制御】が接続します。
// ==========================================================================
// ==========================================================================
// 5. AI（ボット）アルゴリズム ＆ ゲームループ・ルール判定（後編）
// ==========================================================================
Object.assign(BattleEngine, {
    loop(timestamp) {
        if (!this.active) return;
        let dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;

        // タイマー更新（1秒刻み）
        this.timer -= dt;
        if (this.timer <= 0) { this.timer = 0; this.endMatch(); return; }

        this.updatePlayerInput();
        this.updateAI();
        this.updatePhysics();
        this.render();

        if (Math.random() < 0.01) this.updateUI(); // UIの周期的リフレッシュ

        requestAnimationFrame((t) => this.loop(t));
    },

    updatePlayerInput() {
        if (this.player.hp <= 0) return;

        // キーボードおよびバーチャルパッドからの移動ベクトル合成
        let vx = 0, vy = 0;
        if (this.keys['w'] || this.keys['arrowup']) vy = -1;
        if (this.keys['s'] || this.keys['arrowdown']) vy = 1;
        if (this.keys['a'] || this.keys['arrowleft']) vx = -1;
        if (this.keys['d'] || this.keys['arrowright']) vx = 1;

        if (this.joy.active) { vx = this.joy.dirX; vy = this.joy.dirY; }

        // ベクトルの正規化
        let len = Math.hypot(vx, vy);
        if (len > 0) {
            vx /= len; vy /= len;
            this.player.x += vx * this.player.spd;
            this.player.y += vy * this.player.spd;
        }

        // マップ外へのはみ出し制限
        this.player.x = Math.max(this.player.r, Math.min(this.map.w - this.player.r, this.player.x));
        this.player.y = Math.max(this.player.r, Math.min(this.map.h - this.player.r, this.player.y));
    },

    updateAI() {
        const now = performance.now();
        this.entities.forEach(e => {
            if (e.id === 'player' || e.hp <= 0) return;

            // 1. 最寄りの敵をスキャン
            let enemy = null, minDist = 9999;
            this.entities.forEach(o => {
                if (o.team !== e.team && o.hp > 0) {
                    let d = Math.hypot(o.x - e.x, o.y - e.y);
                    if (d < minDist) { minDist = d; enemy = o; }
                }
            });

            // 2. 基本移動思考アルゴリズム
            if (this.modeInfo.id === 'm_area') {
                // エリア制圧戦モード：マップ中心（制圧ゾーン）に向かう
                let cx = this.map.w / 2, cy = this.map.h / 2;
                let dc = Math.hypot(cx - e.x, cy - e.y);
                if (dc > 80) {
                    e.x += ((cx - e.x) / dc) * e.spd * 0.8;
                    e.y += ((cy - e.y) / dc) * e.spd * 0.8;
                }
            } else if (enemy) {
                // 通常モード：敵との距離を保ちつつ接近
                let d = minDist;
                if (d > 180) {
                    e.x += ((enemy.x - e.x) / d) * e.spd * 0.9;
                    e.y += ((enemy.y - e.y) / d) * e.spd * 0.9;
                } else if (d < 80) { // 近すぎる場合は後退
                    e.x -= ((enemy.x - e.x) / d) * e.spd * 0.5;
                    e.y -= ((enemy.y - e.y) / d) * e.spd * 0.5;
                }
            }

            // 壁ずり限界突破
            e.x = Math.max(e.r, Math.min(this.map.w - e.r, e.x));
            e.y = Math.max(e.r, Math.min(this.map.h - e.r, e.y));

            // 3. 自動攻撃・射撃実行
            if (enemy && minDist < 300 && now - e.lastShot > 600 + (Math.random() * 400)) {
                let angle = Math.atan2(enemy.y - e.y, enemy.x - e.x);
                this.spawnBullet(e, angle, false);
                e.lastShot = now;
            }
        });

        // エリア制圧パワー計算
        if (this.modeInfo.id === 'm_area') {
            let cx = this.map.w / 2, cy = this.map.h / 2, bIn = 0, rIn = 0;
            this.entities.forEach(e => {
                if (e.hp > 0 && Math.hypot(e.x - cx, e.y - cy) < 100) {
                    if (e.team === 1) bIn++; else rIn++;
                }
            });
            if (bIn > rIn) this.blueScore = Math.min(this.modeInfo.target, this.blueScore + 0.05);
            if (rIn > bIn) this.redScore = Math.min(this.modeInfo.target, this.redScore + 0.05);
            
            if (this.blueScore >= this.modeInfo.target || this.redScore >= this.modeInfo.target) this.endMatch();
        }
    },

    updatePhysics() {
        // 弾道更新 ＆ ヒットボックス衝突判定
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            let b = this.bullets[i];
            b.x += b.vx; b.y += b.vy;
            b.travelled += Math.hypot(b.vx, b.vy);

            let hit = false;
            for (let j = 0; j < this.entities.length; j++) {
                let e = this.entities[j];
                if (e.hp > 0 && e.team !== b.team) {
                    if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
                        // 命中判定成功
                        e.hp -= b.dmg;
                        this.spawnParticle(b.x, b.y, b.isUlt ? '#f1c40f' : '#fff', 4);
                        hit = true;

                        // プレイヤーのウルトチャージ加算
                        if (b.ownerId === 'player' && !b.isUlt) {
                            this.player.ultCharge = Math.min(this.player.maxUlt, this.player.ultCharge + 15);
                        }

                        // 撃破（キル）判定
                        if (e.hp <= 0) {
                            e.hp = 0;
                            this.spawnParticle(e.x, e.y, '#e74c3c', 15);
                            if (b.team === 1) this.blueScore++; else this.redScore++;
                            this.updateUI();

                            // ラストサバイバルまたはチームキル上限による終了チェック
                            if (this.modeInfo.id === 'm_3v3' && (this.blueScore >= this.modeInfo.target || this.redScore >= this.modeInfo.target)) {
                                this.endMatch();
                                return;
                            }
                            // リスポーン（復活処理：サバイバル以外）
                            if (this.modeInfo.id !== 'm_surv') {
                                setTimeout(() => {
                                    if (!this.active) return;
                                    e.hp = e.maxHp;
                                    e.x = e.team === 1 ? 150 : 750;
                                    e.y = 200 + Math.random() * 400;
                                }, 3000);
                            }
                        }
                        break;
                    }
                }
            }

            // 射程限界、または画面外で弾丸を削除
            if (hit || b.travelled >= b.range || b.x < 0 || b.x > this.map.w || b.y < 0 || b.y > this.map.h) {
                this.bullets.splice(i, 1);
            }
        }

        // パーティクルライフサイクル更新
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= p.decay;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    },

    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // 2.5Dクォータービューカメラ追従システム：プレイヤー中心に画面をスライド
        this.ctx.save();
        let camX = -this.player.x + this.canvas.width / 2;
        let camY = -this.player.y + this.canvas.height / 2;
        camX = Math.min(0, Math.max(this.canvas.width - this.map.w, camX));
        camY = Math.min(0, Math.max(this.canvas.height - this.map.h, camY));
        this.ctx.translate(camX, camY);

        // フィールド背景描画
        this.drawMap();

        // キャラクター（ヒーロー）たちをポップに描画
        this.entities.forEach(e => {
            if (e.hp <= 0) return;

            // 影（シャドウ）の描写
            this.ctx.fillStyle = 'rgba(0,0,0,0.25)';
            this.ctx.beginPath(); this.ctx.arc(e.x, e.y + 12, e.r * 0.9, 0, Math.PI * 2); this.ctx.fill();

            // チーム識別用のアウトライン
            this.ctx.fillStyle = e.color;
            this.ctx.strokeStyle = '#000'; this.ctx.lineWidth = 3;
            this.ctx.beginPath(); this.ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
            this.ctx.fill(); this.ctx.stroke();

            // ドット絵風の絵文字アバター表示
            this.ctx.font = '18px sans-serif'; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
            this.ctx.fillText(e.emoji, e.x, e.y);

            // HPバー（体力インジケータ）の描画
            let barW = 32, barH = 5;
            this.ctx.fillStyle = '#000'; this.ctx.fillRect(e.x - barW/2, e.y - 28, barW, barH);
            this.ctx.fillStyle = e.team === 1 ? '#00ff88' : '#ff3333';
            this.ctx.fillRect(e.x - barW/2, e.y - 28, barW * (e.hp / e.maxHp), barH);
        });

        // 弾丸（弾道エフェクト）の描画
        this.bullets.forEach(b => {
            this.ctx.fillStyle = b.isUlt ? '#f1c40f' : '#ffffff';
            this.ctx.strokeStyle = '#000'; this.ctx.lineWidth = 1.5;
            this.ctx.beginPath(); this.ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            this.ctx.fill(); this.ctx.stroke();
        });

        // パーティクルの描画
        this.particles.forEach(p => {
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = p.life;
            this.ctx.fillRect(p.x - p.r/2, p.y - p.r/2, p.r, p.r);
        });
        this.ctx.globalAlpha = 1.0;

        this.ctx.restore();
    },

    endMatch() {
        this.active = false;
        let win = this.blueScore >= this.redScore;
        
        let rewardCoin = win ? 350 : 80;
        let rewardEmr = win ? 5 : 0;
        
        Storage.data.coins += rewardCoin;
        Storage.data.emeralds += rewardEmr;
        if(win && Math.random() < 0.4) Storage.data.rank += 1;
        Storage.save();

        // ポップアップウインドウで戦績通知
        let over = document.getElementById('modal-overlay');
        let body = document.getElementById('modal-body');
        over.style.display = 'flex';
        body.innerHTML = `
            <h1 style="color:${win ? 'var(--p)':'var(--d)'}; font-size:32px; margin-bottom:10px;">${win ? 'VICTORY！':'DEFEAT...'}</h1>
            <p style="font-size:14px; margin-bottom:15px;">獲得報酬:<br>🪙 +${rewardCoin} コイン / 💎 +${rewardEmr} エメラルド</p>
            <button class="btn btn-g" id="btn-close-modal">ホームに戻る</button>
        `;
        document.getElementById('btn-close-modal').onclick = () => {
            over.style.display = 'none';
            UI.screen('scr-home');
        };
    }
});

// ==========================================================================
// 6. アプリケーション初期化・統合コントロールゲート（ゲーム起動）
// ==========================================================================
const Game = {
    init() {
        // セーブデータ展開とサウンドモジュール準備
        Storage.load();
        BattleEngine.init();
        
        // チェイン接続用スイッチ同期
        document.getElementById('chk-snd').onchange = (e) => { Sound.enabled = e.target.checked; };

        // 疑似ローディングゲージのアニメーション駆動
        let p = 0, bar = document.getElementById('progress');
        let iv = setInterval(() => {
            p += 8 + Math.random() * 12;
            if (p >= 100) {
                p = 100; clearInterval(iv);
                setTimeout(() => {
                    UI.screen('scr-title');
                    Sound.init();
                }, 200);
            }
            bar.style.width = `${p}%`;
        }, 80);
    },
    enterHome() {
        Sound.play(600, 0.1);
        UI.screen('scr-home');
        Storage.sync();
    },
    startMatch() {
        Sound.play(523, 0.15, 'triangle');
        BattleEngine.start(Storage.data.selectedChar, Storage.data.selectedMode);
    }
};

// 全体の起動エントリー
window.onload = () => { Game.init(); };
</script>
